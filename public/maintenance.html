<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Cloud | Resting</title>
    <style>
        :root {
            --primary: #a855f7;
            --secondary: #22d3ee;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .container:hover {
            transform: scale(1.02) translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 0 80px rgba(168, 85, 247, 0.15);
        }
        .logo-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 40px;
            animation: float 4s ease-in-out infinite;
        }
        .logo-box svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px var(--primary));
        }
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .orbit-dot {
            position: absolute;
            top: -5px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--secondary);
            animation: rotate 3s linear infinite;
            transform-origin: 4px 85px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
        }
        #message-container {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message {
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            max-width: 450px;
            line-height: 1.6;
            font-weight: 500;
            transition: all 0.8s ease;
            opacity: 0;
            transform: translateY(10px);
        }
        .message.active {
            opacity: 1;
            transform: translateY(0);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .pulse {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container">
        <div class="status-badge">
            <div class="pulse"></div>
            Atmosphere is Calibrating
        </div>
        <div class="logo-box">
            <div class="orbit"><div class="orbit-dot"></div></div>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7V17L12 22L21 17V7L12 2Z" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#22d3ee" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h1>Cyber-Cloud is Dreaming</h1>
        <div id="message-container">
            <div id="dynamic-message" class="message active">Just taking a quick nap... we'll be back in a flash! ✨</div>
        </div>
    </div>

    <script>
        const messages = [
            "Just taking a quick nap... we'll be back in a flash! ✨",
            "Brewing some fresh financial magic just for you. ☕",
            "Polishing your dashboard to a high premium shine. 💎",
            "Our numbers are doing some yoga. Namaste. 🧘",
            "The data streams are resting. Waking them up soon. 🌙",
            "Adding a touch of stardust to your financial vault. 🌌",
            "Anticipating your next big move while we recharge. 🚀"
        ];

        let index = 0;
        const msgEl = document.getElementById('dynamic-message');

        setInterval(() => {
            msgEl.classList.remove('active');
            setTimeout(() => {
                index = (index + 1) % messages.length;
                msgEl.innerText = messages[index];
                msgEl.classList.add('active');
            }, 800);
        }, 5000);

        // --- Particle Background ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(168, 85, 247, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Auto-reconnect check
        setInterval(() => {
            fetch('/').then(res => {
                if (res.ok) window.location.reload();
            }).catch(() => {});
        }, 3000);
    </script>
</body>
</html>
